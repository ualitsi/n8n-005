services:
  web:
    build: ./web
    container_name: task-manager-web
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./web:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/taskdb
      RABBITMQ_URL: amqp://task_user:task_password@mq:5672/%2F
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy

  worker:
    build: ./worker
    container_name: task-manager-worker
    restart: unless-stopped
    volumes:
      - ./worker:/app
    environment:
      RABBITMQ_URL: amqp://task_user:task_password@mq:5672/%2F
    depends_on:
      mq:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: task-manager-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mq:
    image: rabbitmq:3-management-alpine
    container_name: task-manager-mq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: task_user
      RABBITMQ_DEFAULT_PASS: task_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
